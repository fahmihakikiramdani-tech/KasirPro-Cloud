<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f8fa"><title>KasirPro Admin</title>
<style>
:root{font-family:Inter,"Segoe UI",system-ui,sans-serif;font-size:14px;color:#0f172a;color-scheme:light;--line:#e8ebf0;--bd:#e8ebf0;--muted:#64748b;--blue:#1677ff;--navy:#0f172a;--green:#12b76a;--red:#ef4444;--amber:#f59e0b;--bg:#f7f8fa;--ease:cubic-bezier(.2,.8,.2,1);--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}.hidden{display:none!important}
::selection{background:#1677ff33}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:#d5dbe5;border-radius:8px}
.shell{max-width:1240px;margin:0 auto;padding:32px 32px 96px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:40px}
.brand{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:700;letter-spacing:-.3px}
.brand span{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#3b9bff,#1677ff);color:#fff;font-size:15px;font-weight:800;box-shadow:0 6px 16px #1677ff44}
.tabs{position:relative;display:flex;gap:4px;padding:4px;background:#eceff4;border-radius:12px}
.tab{position:relative;z-index:1;border:0;background:none;padding:9px 22px;border-radius:9px;color:var(--muted);font-weight:600;transition:color .2s}
.tab:hover,.tab.active{color:#0f172a}
.tabInd{position:absolute;top:4px;bottom:4px;left:0;background:#fff;border-radius:9px;box-shadow:0 1px 3px #0f172a22;transition:transform .35s var(--ease),width .35s var(--ease)}
.barRight{display:flex;align-items:center;gap:12px}
.live{font:500 12px var(--mono);white-space:nowrap;background:#fff;border:1px solid var(--line);padding:9px 14px;border-radius:99px}
.btn{height:38px;padding:0 18px;border:1px solid #dde3ec;background:#fff;border-radius:10px;font-weight:600;transition:transform .15s var(--ease),border-color .2s,box-shadow .2s,background .2s}
.btn:hover{border-color:#a9c9ff;box-shadow:0 4px 14px #1677ff1f}.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#3b9bff,#1677ff);border-color:transparent;color:#fff;box-shadow:0 6px 16px #1677ff40}.btn.primary:hover{filter:brightness(1.07);box-shadow:0 8px 20px #1677ff60}
.btn.danger{color:#dc2626}
.btn.small{height:auto;padding:6px 12px;font-size:12.5px;border-radius:8px;background:transparent;border-color:transparent;color:var(--muted)}
.btn.small:hover{background:#f1f5f9;box-shadow:none}
.btn.small.danger{color:#dc2626}.btn.small.danger:hover{background:#fef2f2}
.btn.small.primary{color:#1677ff;background:transparent;box-shadow:none;filter:none}.btn.small.primary:hover{background:#eff6ff}
.btn:disabled{opacity:.5;cursor:wait}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin-bottom:32px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.stat{background:#fff;padding:28px 28px 30px;transition:background .2s}.stat:hover{background:#fbfcfe}
.statLabel{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px;font-weight:500}
.statLabel:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,#1677ff)}
.stat:nth-child(2){--c:#12b76a}.stat:nth-child(3){--c:#06b6d4}.stat:nth-child(4){--c:#f59e0b}
.statValue{margin-top:14px;font-size:36px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;animation:fade .35s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.panelHead{display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line)}
.filters{display:flex;gap:12px;flex-wrap:wrap;flex:1}
.filters input,.filters select,.field input{height:40px;padding:0 14px;border:1px solid #dde3ec;border-radius:10px;background:#fff;min-width:170px;transition:border-color .2s,box-shadow .2s}
.filters input{flex:1;max-width:340px}
.filters input:focus,.filters select:focus,.field input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px #1677ff1f}
::placeholder{color:#94a3b8}
.tableWrap{overflow:auto}
table{width:100%;border-collapse:separate;border-spacing:0;white-space:nowrap}
th,td{padding:16px 24px;text-align:left;border-bottom:1px solid #f0f2f6;font-size:13.5px}
th{background:#fafbfc;color:var(--muted);font-size:12px;font-weight:600;padding-top:13px;padding-bottom:13px}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s}tbody tr:hover{background:#f8fafc}
tbody tr td:first-child{box-shadow:inset 0 0 0 var(--blue);transition:box-shadow .2s}
tbody tr.sel{background:#eff6ff}tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--blue)}
.email{font-weight:600}
.mono,#usersBody td:nth-child(5),#usersBody td:nth-child(6),#tab-licenses td:first-child strong{font-family:var(--mono);font-size:12.5px}
.mono{color:var(--muted)}
.badge{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:600;background:#f1f5f9;color:#64748b}
.badge.ok{background:#e8f8f0;color:#0e9f5a}.badge.bad{background:#fdeceb;color:#dc2626}.badge.warn{background:#fff3e0;color:#b45309}.badge.info{background:#e8f1ff;color:#1d5fd1}.badge.dim{background:#f1f5f9;color:#64748b}
.rowActions{display:flex;gap:6px}
.deviceList{white-space:normal;min-width:210px;max-width:330px;line-height:1.7}.deviceList .badge{margin:0 6px 8px 0}.deviceMini{display:block;font-size:12.5px;margin:3px 0}
.muted{color:var(--muted)}.empty{padding:56px 24px;text-align:center;color:var(--muted)}
.licenseForm{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:20px 24px;border-bottom:1px solid var(--line)}
.field label{display:block;font-size:12px;font-weight:500;margin-bottom:6px;color:var(--muted)}
.licenseForm .field input{width:160px}
.licenseForm .btn{height:40px}
.codes{margin:24px;padding:20px 22px;background:#0b1220;color:#7ee787;border-radius:14px;font:13px/1.7 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;animation:fade .35s var(--ease)}
.loginWrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(640px 360px at 50% 0,#dbe9ff,transparent),var(--bg)}
.loginCard{width:min(380px,100%);display:flex;flex-direction:column;gap:14px;padding:36px 32px 28px;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 60px #0f172a14;animation:fade .5s var(--ease)}
.loginCard .brand{justify-content:center;margin-bottom:14px}
.loginCard input{width:100%;height:44px;padding:0 16px;border:1px solid #dde3ec;border-radius:12px;background:#fff;transition:border-color .2s,box-shadow .2s}
.loginCard input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px #1677ff1f}
.loginCard .btn.primary{height:46px;margin-top:6px;border-radius:12px}
.error{min-height:18px;font-size:13px;color:var(--red);text-align:center}
@media(max-width:820px){.shell{padding:20px 16px 80px}.bar{flex-wrap:wrap;margin-bottom:28px}.tabs{order:3;width:100%}.tab{flex:1;padding:10px 8px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:22px}.statValue{font-size:30px}.panelHead,.licenseForm{padding:16px}.filters input{max-width:none}th,td{padding:14px 16px}.live{font-size:11px;padding:8px 10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<section id="loginView" class="loginWrap"><form class="loginCard" id="loginForm"><div class="brand"><span>K</span>KasirPro</div><input id="adminEmail" type="email" autocomplete="username" placeholder="Email" aria-label="Email" required><input id="adminPassword" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required><button class="btn primary" type="submit">Masuk</button><div id="loginError" class="error" role="status"></div></form></section>
<main id="appView" class="shell hidden">
 <header class="bar"><div class="brand"><span>K</span>KasirPro</div><nav class="tabs"><button class="tab active" data-tab="customers">Akun</button><button class="tab" data-tab="devices">Perangkat</button><button class="tab" data-tab="licenses">Lisensi</button></nav><div class="barRight"><span id="liveLabel" class="live">● MENYAMBUNG…</span><button id="logoutBtn" class="btn">Keluar</button></div></header>
 <section class="stats"><div class="stat"><div class="statLabel">Total akun</div><div id="statUsers" class="statValue">—</div></div><div class="stat"><div class="statLabel">Aktif</div><div id="statActive" class="statValue">—</div></div><div class="stat"><div class="statLabel">Online</div><div id="statOnline" class="statValue">—</div></div><div class="stat"><div class="statLabel">Slot terpakai</div><div id="statDevices" class="statValue">—</div></div></section>
 <section id="tab-customers" class="panel"><div class="panelHead"><div class="filters"><input id="userSearch" placeholder="Cari email   ( / )"><select id="statusFilter"><option value="all">Semua status</option><option value="active">Aktif</option><option value="inactive">Belum aktivasi</option><option value="blocked">Diblokir</option></select></div></div><div class="tableWrap"><table><thead><tr><th>Email</th><th>Peran</th><th>Akun</th><th>Lisensi</th><th>Online</th><th>Slot</th><th>Terdaftar</th><th></th></tr></thead><tbody id="usersBody"><tr><td colspan="8" class="empty">Memuat data…</td></tr></tbody></table></div></section>
 <section id="tab-devices" class="panel hidden"><div class="panelHead"><div class="filters"><input id="deviceSearch" placeholder="Cari email / perangkat   ( / )"><select id="deviceFilter"><option value="all">Semua</option><option value="online">Online</option><option value="offline">Offline</option><option value="revoked">Dicabut</option></select></div></div><div class="tableWrap"><table><thead><tr><th>Email</th><th>Perangkat</th><th>Koneksi</th><th>Akses</th><th>Sesi</th><th>Login terakhir</th><th></th></tr></thead><tbody id="devicesBody"><tr><td colspan="7" class="empty">Memuat data…</td></tr></tbody></table></div></section>
 <section id="tab-licenses" class="panel hidden"><form id="licenseForm" class="licenseForm"><div class="field"><label for="licenseCount">Jumlah</label><input id="licenseCount" type="number" min="1" max="100" value="1" required></div><div class="field"><label for="licenseExpiry">Kedaluwarsa</label><input id="licenseExpiry" type="date"></div><button class="btn primary" type="submit">Buat lisensi</button></form><div id="newCodes" class="codes hidden"></div><div class="tableWrap"><table><thead><tr><th>Kode</th><th>Status</th><th>Akses</th><th>Pengguna</th><th>Perangkat</th><th>Dibuat</th><th>Aktif</th><th>Kedaluwarsa</th><th></th></tr></thead><tbody id="licensesBody"><tr><td colspan="9" class="empty">Memuat data…</td></tr></tbody></table></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const dt=value=>{if(!value)return '—';const d=new Date(value);return Number.isNaN(d.getTime())?'—':new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',dateStyle:'medium',timeStyle:'short'}).format(d)};
const deviceId=(()=>{let id=localStorage.getItem('kp_admin_device_id');if(!id){const bytes=crypto.getRandomValues(new Uint8Array(18));id='kp_admin_'+Array.from(bytes).map(x=>x.toString(16).padStart(2,'0')).join('');localStorage.setItem('kp_admin_device_id',id)}return id})();
let users=[],devices=[],licenses=[],busy=false,loggedIn=false,activeTab='customers';
async function api(url,options={}){const response=await fetch(url,{credentials:'same-origin',cache:'no-store',...options,headers:{...(options.headers||{})}});let body={};try{body=await response.json()}catch{}if(!response.ok){const error=new Error(body.error||body.message||`Permintaan gagal (${response.status})`);error.status=response.status;throw error}return body}
function showLogin(message=''){loggedIn=false;$('loginView').classList.remove('hidden');$('appView').classList.add('hidden');$('loginError').textContent=message;}
function showApp(){loggedIn=true;$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');}
$('loginForm').addEventListener('submit',async event=>{event.preventDefault();const button=$('loginForm').querySelector('button');button.disabled=true;$('loginError').textContent='Memeriksa akun admin…';try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('adminEmail').value.trim(),password:$('adminPassword').value,deviceId,deviceLabel:'KasirPro Admin Panel'})});$('adminPassword').value='';showApp();await refreshAll()}catch(error){showLogin(error.message)}finally{button.disabled=false}});
function licenseLabel(user){
  if(user.license_admin_disabled)return '<span class="badge bad">Nonaktif oleh admin</span>';
  if(!user.license_status)return '<span class="badge warn">Belum ada lisensi</span>';
  if(user.license_expires_at&&new Date(user.license_expires_at)<=new Date())return '<span class="badge bad">Kedaluwarsa</span>';
  if(user.license_status==='active')return '<span class="badge ok">Aktif</span>';
  if(user.license_status==='unused')return '<span class="badge info">Belum digunakan</span>';
  return `<span class="badge warn">${esc(user.license_status)}</span>`;
}
function renderUsers(){
  const search=$('userSearch').value.trim().toLowerCase(),filter=$('statusFilter').value;
  const list=users.filter(u=>{
    if(!String(u.email||'').toLowerCase().includes(search))return false;
    if(filter==='active')return !!u.active&&!u.admin_blocked;
    if(filter==='inactive')return !u.active&&!u.admin_blocked;
    if(filter==='blocked')return !!u.admin_blocked;
    return true;
  });
  $('usersBody').innerHTML=list.map(u=>{
    const accountStatus=u.admin_blocked
      ? '<span class="badge bad">Diblokir</span>'
      : u.active ? '<span class="badge ok">Aktif</span>' : '<span class="badge warn">Belum aktivasi</span>';
    const actions=u.role==='admin' ? '<span class="muted">—</span>' : `<div class="rowActions"><button class="btn small ${u.admin_blocked?'primary':'danger'}" data-user-block="${esc(u.id)}" data-blocked="${u.admin_blocked?'false':'true'}">${u.admin_blocked?'Buka blokir':'Blokir'}</button><button class="btn danger small" data-user-delete="${esc(u.id)}">Hapus</button></div>`;
    return `<tr><td class="email">${esc(u.email)}</td><td>${u.role==='admin'?'<span class="badge info">Admin</span>':'Customer'}</td><td>${accountStatus}</td><td>${licenseLabel(u)}</td><td><strong>${Number(u.online_devices)||0}</strong></td><td><strong>${u.role==='admin'?`${Number(u.active_devices)||0} (tanpa batas)`:`${Number(u.active_devices)||0}/2`}</strong></td><td>${dt(u.created_at)}</td><td>${actions}</td></tr>`;
  }).join('')||'<tr><td colspan="8" class="empty">Tidak ada akun yang cocok.</td></tr>';
}
function renderDevices(){const q=$('deviceSearch').value.trim().toLowerCase(),filter=$('deviceFilter').value;const list=devices.filter(d=>`${d.email||''} ${d.label||''} ${d.id||''}`.toLowerCase().includes(q)&&(filter==='all'||(filter==='online'&&d.online&&!d.revoked)||(filter==='offline'&&!d.online&&!d.revoked)||(filter==='revoked'&&d.revoked)));$('devicesBody').innerHTML=list.map(d=>`<tr><td class="email">${esc(d.email)}</td><td><div>${esc(d.label||'Perangkat')}</div><div class="mono">${esc(String(d.id).slice(0,18))}…</div></td><td>${d.online&&!d.revoked?'<span class="badge ok">● Online</span>':'<span class="badge">○ Offline</span>'}</td><td>${d.revoked?'<span class="badge bad">Dicabut</span>':'<span class="badge info">Terdaftar</span>'}</td><td>${Number(d.active_sessions)||0}</td><td>${dt(d.last_seen)}</td><td>${d.revoked?'<span class="muted">—</span>':`<button class="btn danger small" data-revoke-device="${esc(d.id)}">Cabut akses</button>`}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">Tidak ada perangkat yang cocok.</td></tr>';}
function renderLicenses(){
  const userMap=new Map(users.map(u=>[String(u.id),u.email]));
  $('licensesBody').innerHTML=licenses.map(l=>{
    const expired=l.expires_at&&new Date(l.expires_at)<=new Date();
    const status=expired?'Kedaluwarsa':(l.status||'—');
    const cls=status==='active'?'ok':status==='unused'?'info':'warn';
    const attached=devices.filter(d=>String(d.user_id)===String(l.user_id));
    const online=attached.filter(d=>d.online&&!d.revoked);
    const registered=attached.filter(d=>!d.revoked);
    const deviceCell=l.user_id
      ? `<div class="deviceList"><span class="badge ${online.length?'ok':'dim'}">${online.length} online</span> <span class="badge info">${registered.length}/2 slot aktif</span>${attached.length?attached.map(d=>`<span class="deviceMini">${d.online&&!d.revoked?'🟢':'⚪'} ${esc(d.label||'Perangkat')} ${d.revoked?'(dicabut)':d.online?'(online)':'(offline)'}</span>`).join(''):'<span class="deviceMini muted">Belum ada perangkat</span>'}</div>`
      : '<span class="muted">Belum terhubung ke akun</span>';
    const access=l.admin_disabled?'<span class="badge bad">Dinonaktifkan</span>':'<span class="badge ok">Diizinkan</span>';
    const toggle=`<button class="btn small ${l.admin_disabled?'primary':'danger'}" data-license-toggle="${esc(l.id)}" data-enabled="${l.admin_disabled?'true':'false'}">${l.admin_disabled?'Aktifkan':'Nonaktifkan'}</button>`;
    return `<tr><td><strong>${esc(l.code_hint||'—')}</strong></td><td><span class="badge ${cls}">${esc(status)}</span></td><td>${access}</td><td>${esc(userMap.get(String(l.user_id))||'Belum terhubung')}</td><td>${deviceCell}</td><td>${dt(l.created_at)}</td><td>${dt(l.activated_at)}</td><td>${dt(l.expires_at)}</td><td>${toggle}</td></tr>`;
  }).join('')||'<tr><td colspan="9" class="empty">Belum ada lisensi.</td></tr>';
}
function renderStats(){ const customers=users.filter(u=>u.role!=='admin');$('statUsers').textContent=users.length;$('statActive').textContent=users.filter(u=>u.active).length;$('statOnline').textContent=devices.filter(d=>d.role!=='admin'&&d.online&&!d.revoked).length;$('statDevices').textContent=customers.reduce((sum,u)=>sum+(Number(u.active_devices)||0),0); }
async function refreshAll(){if(busy||!loggedIn)return;busy=true;try{const data=await api('/api/admin/overview');users=data.users||[];devices=data.devices||[];licenses=data.licenses||[];renderStats();renderUsers();renderDevices();renderLicenses();$('liveLabel').textContent='● LIVE · diperbarui '+new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date());$('liveLabel').style.color='var(--green)';}catch(error){$('liveLabel').textContent='● KONEKSI TERGANGGU';$('liveLabel').style.color='var(--red)';if(error.status===401||error.status===403)showLogin('Sesi admin berakhir. Silakan masuk kembali.');else console.warn('Pembaruan panel tertunda:',error.message)}finally{busy=false}}
$('userSearch').addEventListener('input',renderUsers);$('statusFilter').addEventListener('change',renderUsers);$('deviceSearch').addEventListener('input',renderDevices);$('deviceFilter').addEventListener('change',renderDevices);
$('usersBody').addEventListener('click',async event=>{
  const blockButton=event.target.closest('[data-user-block]');
  const deleteButton=event.target.closest('[data-user-delete]');
  if(blockButton){
    const id=blockButton.dataset.userBlock,blocked=blockButton.dataset.blocked==='true';
    const user=users.find(u=>String(u.id)===String(id));
    if(!user)return;
    const message=blocked?`Blokir ${user.email}? Semua sesi login akan dicabut.`:`Buka blokir ${user.email}? Customer harus login ulang.`;
    if(!confirm(message))return;
    blockButton.disabled=true;
    try{await api('/api/admin/users/'+encodeURIComponent(id)+'/block',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({blocked})});await refreshAll();}
    catch(error){alert(error.message)}finally{blockButton.disabled=false}
    return;
  }
  if(deleteButton){
    const id=deleteButton.dataset.userDelete,user=users.find(u=>String(u.id)===String(id));
    if(!user)return;
    if(!confirm(`HAPUS PERMANEN akun ${user.email}? Sesi, perangkat, lisensi yang terhubung, dan data cloud akun ini juga akan dihapus. Tindakan ini tidak dapat dibatalkan.`))return;
    deleteButton.disabled=true;
    try{await api('/api/admin/users/'+encodeURIComponent(id),{method:'DELETE'});await refreshAll();alert('Akun '+user.email+' berhasil dihapus.');}
    catch(error){alert('Akun belum terhapus: '+error.message)}finally{deleteButton.disabled=false}
  }
});
$('licensesBody').addEventListener('click',async event=>{
  const button=event.target.closest('[data-license-toggle]');if(!button)return;
  const id=button.dataset.licenseToggle,enabled=button.dataset.enabled==='true';
  const license=licenses.find(l=>String(l.id)===String(id));if(!license)return;
  const email=users.find(u=>String(u.id)===String(license.user_id))?.email||'lisensi ini';
  if(!confirm(`${enabled?'Aktifkan':'Nonaktifkan'} lisensi ${license.code_hint||''} untuk ${email}?${enabled?' Customer perlu login kembali jika sesi sebelumnya telah dicabut.':' Semua sesi dan perangkat akun customer akan dicabut.'}`))return;
  button.disabled=true;
  try{await api('/api/admin/licenses/'+encodeURIComponent(id)+'/enabled',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled})});await refreshAll();}
  catch(error){alert(error.message)}finally{button.disabled=false}
});
document.querySelectorAll('[data-tab]').forEach(button=>button.addEventListener('click',()=>{activeTab=button.dataset.tab;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b===button));['customers','devices','licenses'].forEach(tab=>$('tab-'+tab).classList.toggle('hidden',tab!==activeTab));}));
$('devicesBody').addEventListener('click',async event=>{const button=event.target.closest('[data-revoke-device]');if(!button)return;const id=button.dataset.revokeDevice;if(!confirm('Cabut akses perangkat ini? Sesi pada perangkat tersebut akan diakhiri.'))return;button.disabled=true;try{await api('/api/admin/devices/'+encodeURIComponent(id)+'/revoke',{method:'POST'});await refreshAll()}catch(error){alert(error.message)}finally{button.disabled=false}});
$('licenseForm').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;button.disabled=true;try{const count=Number($('licenseCount').value),expires=$('licenseExpiry').value;const body={count};if(expires)body.expiresAt=new Date(expires+'T23:59:59+07:00').toISOString();const result=await api('/api/admin/licenses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const codes=(result.licenses||[]).map(x=>x.code).filter(Boolean);if(codes.length){$('newCodes').textContent='Simpan kode ini sekarang — kode penuh tidak ditampilkan lagi:\n\n'+codes.join('\n');$('newCodes').classList.remove('hidden')}await refreshAll();}catch(error){alert(error.message)}finally{button.disabled=false}});
$('logoutBtn').addEventListener('click',async()=>{try{await api('/api/logout',{method:'POST'});}catch{}showLogin('Kamu sudah keluar dari panel admin.');});
(async()=>{try{const response=await fetch('/api/admin/users',{credentials:'same-origin',cache:'no-store'});if(response.ok){showApp();await refreshAll()}else showLogin()}catch{showLogin('Server tidak dapat dihubungi. Periksa koneksi.')}setInterval(refreshAll,8000)})();
</script>
<script>
/* tambahan visual saja: indikator tab, animasi angka, seleksi baris, shortcut "/". Logika asli tidak disentuh. */
(()=>{const g=id=>document.getElementById(id),Q=s=>document.querySelector(s),QA=s=>document.querySelectorAll(s);
const nav=Q('.tabs'),ind=document.createElement('span');ind.className='tabInd';nav.prepend(ind);
const mv=()=>{const a=nav.querySelector('.tab.active');if(!a||!a.offsetWidth)return;ind.style.width=a.offsetWidth+'px';ind.style.transform=`translateX(${a.offsetLeft}px)`};
nav.addEventListener('click',()=>requestAnimationFrame(mv));addEventListener('resize',mv);new MutationObserver(mv).observe(g('appView'),{attributes:true,attributeFilter:['class']});setTimeout(mv,60);
let sel='';const mark=()=>QA('tbody tr').forEach(r=>{const c=r.firstElementChild;r.classList.toggle('sel',!!sel&&!!c&&!c.classList.contains('empty')&&c.textContent.trim()===sel)});
QA('tbody').forEach(tb=>{new MutationObserver(mark).observe(tb,{childList:true});tb.addEventListener('click',e=>{const r=e.target.closest('tr'),c=r&&r.firstElementChild;if(!c||e.target.closest('button')||c.classList.contains('empty'))return;const k=c.textContent.trim();sel=sel===k?'':k;mark()})});
addEventListener('keydown',e=>{if(e.key!=='/'||e.ctrlKey||e.metaKey||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)||g('appView').classList.contains('hidden'))return;e.preventDefault();(Q('.panel:not(.hidden) .filters input')||g('licenseCount')).focus()});
['statUsers','statActive','statOnline','statDevices'].forEach(id=>{const el=g(id);let cur=0,lock=false;
new MutationObserver(()=>{if(lock)return;const to=Number(el.textContent);if(!Number.isFinite(to)||el.textContent.trim()==='')return;const from=cur;cur=to;if(from===to)return;lock=true;const t0=performance.now();
const step=t=>{const p=Math.min((t-t0)/600,1),e=1-Math.pow(1-p,3);el.textContent=Math.round(from+(to-from)*e);if(p<1)requestAnimationFrame(step);else{el.textContent=to;lock=false}};requestAnimationFrame(step)}).observe(el,{childList:true,characterData:true,subtree:true})})})();
</script>
</body></html>
