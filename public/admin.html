<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KasirPro Admin</title><style>body{margin:0;background:#f4f6fb;color:#17243a;font:14px system-ui,Arial}.wrap{max-width:1050px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e4e9f2;border-radius:16px;padding:20px;margin:16px 0}h1,h2{letter-spacing:-.5px}input,button{font:inherit;padding:11px 13px;border-radius:9px;border:1px solid #d8dfeb}button{cursor:pointer;background:#4263eb;color:white;border:0;font-weight:700}.row{display:flex;gap:10px;flex-wrap:wrap}.row input{flex:1;min-width:180px}table{border-collapse:collapse;width:100%;margin-top:12px}td,th{text-align:left;border-bottom:1px solid #edf0f5;padding:10px;font-size:13px}th{color:#69758b}.hidden{display:none}.codes{white-space:pre-wrap;word-break:break-word;background:#f5f7fb;padding:12px;border-radius:10px}.muted{color:#738097}</style></head><body><div class="wrap"><h1>KasirPro <span style="color:#4263eb">Admin</span></h1><p class="muted">Kelola lisensi aktivasi dan customer.</p><section class="card" id="login"><h2>Login admin</h2><form id="loginForm" class="row"><input id="email" type="email" placeholder="Email admin" required><input id="password" type="password" placeholder="Password admin" required><button>Masuk</button></form><p id="loginMsg"></p></section><div id="dash" class="hidden"><section class="card"><h2>Buat kode aktivasi</h2><p class="muted">Kode acak permanen, sekali pakai. Kode lengkap hanya ditampilkan saat dibuat.</p><form id="issue" class="row"><input id="count" type="number" min="1" max="100" value="1"><button>Buat kode</button><button type="button" id="refresh" style="background:#17845f">Muat ulang data</button></form><div id="codes" class="codes hidden"></div></section><section class="card"><h2>Lisensi</h2><div id="licenses"></div></section><section class="card"><h2>Customer</h2><div id="users"></div></section></div></div><script>const $=s=>document.querySelector(s);const deviceId='admin_'+(localStorage.kp_admin_device||(localStorage.kp_admin_device=crypto.randomUUID()));async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.error||'Permintaan gagal');return d}$('#loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value,deviceId})});$('#login').classList.add('hidden');$('#dash').classList.remove('hidden');await load()}catch(err){$('#loginMsg').textContent=err.message}};$('#issue').onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/admin/licenses',{method:'POST',body:JSON.stringify({count:Number($('#count').value)})});$('#codes').textContent=d.codes.join('\n');$('#codes').classList.remove('hidden');await load()}catch(err){alert(err.message)}};$('#refresh').onclick=()=>load().catch(e=>alert(e.message));async function load(){const [ls,us]=await Promise.all([api('/api/admin/licenses'),api('/api/admin/users')]);$('#licenses').innerHTML=table(['Status','Petunjuk kode','Dibuat','Aktif pada','Email customer'],ls.map(x=>[x.status,x.code_hint,x.created_at,x.activated_at||'—',x.email||'—']));$('#users').innerHTML=table(['Email','Lisensi','Perangkat aktif','Daftar','Aksi'],us.map(x=>[x.email,x.license_status||'Belum aktif',x.devices,x.created_at,`<button data-revoke="${x.id}" style="background:#c74455">Cabut akses</button>`]));document.querySelectorAll('[data-revoke]').forEach(b=>b.onclick=async()=>{if(confirm('Nonaktifkan lisensi dan seluruh sesi customer ini?')){await api('/api/admin/users/'+b.dataset.revoke+'/revoke',{method:'POST',body:'{}'});await load()}})}function table(head,rows){return '<div style="overflow:auto"><table><thead><tr>'+head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}</script></body></html>
